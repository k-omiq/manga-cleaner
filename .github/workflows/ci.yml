name: CI

# Lightweight gate: frontend build plus Rust check/clippy. Deliberately skips
# the heavy ML model downloads - this proves the two surfaces build, not that
# detection/inpainting runs (that needs the model weights + a real desktop app).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (vitest + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vite build

  rust:
    name: Rust (check + clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Tauri's crates link against webkit2gtk/gtk via pkg-config, so even
      # `cargo check` needs the desktop dev libraries on Linux. `libdbus-1-dev`
      # is there for `keyring`: its Linux features pull `dbus-secret-service`,
      # whose `libdbus-sys` build script asks pkg-config for `dbus-1`. That
      # resolves today only because another dependency happens to bring the
      # headers in, so it is named explicitly rather than relied on.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            build-essential \
            curl wget file patchelf
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        run: cargo check --workspace --exclude spike-strip-memory
      - name: cargo clippy (deny warnings)
        run: cargo clippy -p cleaner-core -p manga-cleaner --no-deps --all-targets -- -D warnings
