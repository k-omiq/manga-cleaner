[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-cleaner-sidecar"
version = "0.1.0"
description = "Manga Cleaner FLUX.2 Klein 4B Inpainting Sidecar Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mflux==0.18.1",
    "Pillow>=10.0.0",
]

[project.scripts]
manga-cleaner-sidecar = "manga_cleaner_sidecar.__main__:main"
